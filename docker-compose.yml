services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      KAMA_ENV: prod
      KAMA_HOST: 0.0.0.0
      KAMA_PORT: "8000"
      KAMA_MODELS_DIR: /models
      KAMA_CONTENT_DIR: /srv/kama/content-data
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8124:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
