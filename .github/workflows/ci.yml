name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kama_frontend/package-lock.json
      - name: Install
        working-directory: kama_frontend
        run: npm ci
      - name: Typecheck
        working-directory: kama_frontend
        run: npm run compile
      - name: Build Chrome
        working-directory: kama_frontend
        run: npm run build
      - name: Build Edge
        working-directory: kama_frontend
        run: npm run build:edge
      - name: Build jury
        working-directory: kama_frontend
        run: npm run build:jury
      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kama-extension
          path: |
            kama_frontend/.output/chrome-mv3
            kama_frontend/.output/edge-mv3
            kama_frontend/.output/chrome-mv3-jury
            kama_frontend/.output/edge-mv3-jury

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Deploy on VPS via SSH
        if: ${{ secrets.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_REPO_PATH }}"
            git pull --ff-only
            docker compose up -d --build
      - name: Build extension zips
        working-directory: kama_frontend
        run: |
          npm ci
          npm run build
          npm run build:edge
          npm run build:jury
          cd .output
          for d in chrome-mv3 edge-mv3 chrome-mv3-jury edge-mv3-jury; do
            (cd "$d" && zip -r "../../${d}.zip" .)
          done
      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: kama-extension-zips
          path: kama_frontend/*.zip
