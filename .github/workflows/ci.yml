name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kama_frontend/package-lock.json
      - name: Install
        working-directory: kama_frontend
        run: npm ci
      - name: Typecheck
        working-directory: kama_frontend
        run: npm run compile
      - name: Build Chrome
        working-directory: kama_frontend
        run: npm run build
      - name: Build Edge
        working-directory: kama_frontend
        run: npm run build:edge
      - name: Build jury
        working-directory: kama_frontend
        run: npm run build:jury
      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kama-extension
          path: |
            kama_frontend/.output/chrome-mv3
            kama_frontend/.output/edge-mv3
            kama_frontend/.output/chrome-mv3-jury
            kama_frontend/.output/edge-mv3-jury
