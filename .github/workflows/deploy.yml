name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_REPO_PATH }}"
            git pull --ff-only
            docker compose up -d --build
            docker compose ps

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kama_frontend/package-lock.json
      - name: Install
        working-directory: kama_frontend
        run: npm ci
      - name: Build
        working-directory: kama_frontend
        run: |
          npm run build
          npm run build:edge
          npm run build:jury
      - name: Zip outputs
        working-directory: kama_frontend/.output
        run: |
          for d in chrome-mv3 edge-mv3 chrome-mv3-jury edge-mv3-jury; do
            (cd "$d" && zip -r "../../${d}.zip" .)
          done
      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: kama-extension-zips
          path: kama_frontend/*.zip
